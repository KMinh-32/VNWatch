<rect x="45" y="2518" width="3230" height="132" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="65" y="2547.0" text-anchor="start" font-size="16" font-weight="700" fill="#1f2937">Entity dùng trong luồng: PhienChat, TinNhanChat, SanPham, KienThucChatbot, SanPhamGoiY, NguonTraLoi.</text>
<text x="65" y="2578.0" text-anchor="start" font-size="15" font-weight="400" fill="#1f2937">MaTK lấy từ ngữ cảnh đăng nhập; khách vãng lai có MaTK = NULL. Chỉ dùng kiến thức DA_DUYET. Chỉ hiển thị kết quả sau COMMIT.</text>
<text x="65" y="2609.0" text-anchor="start" font-size="15" font-weight="400" fill="#1f2937">Hệ thống AI là phân hệ tư vấn (FastAPI, OpenAI nếu cấu hình). ChatbotController kiểm tra ID sản phẩm và nguồn trước khi lưu.</text>
<text x="65" y="2636.0" text-anchor="start" font-size="14" font-weight="400" fill="#64748b">Các lớp Entity biểu diễn truy cập bảng ERD. Đây là sequence phân tích luồng cơ bản; các nhánh lỗi/dự phòng nằm ở thiết kế mở rộng.</text>
<text x="45" y="2694.0" text-anchor="start" font-size="14" font-weight="400" fill="#64748b">Bản thiết kế theo ERD mới; thao tác lưu lịch sử/nguồn chưa được triển khai vào database đang chạy.</text>
</g></svg>