<text x="39" y="2357.0" font-size="15" font-weight="400" text-anchor="start" fill="#172b43">Trả thành công và MaTNAI cho interaction gọi; Sequence 02 mới trả kết quả về giao diện.</text>
<rect x="22" y="2457" width="1976" height="170" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="38" y="2483.0" font-size="14" font-weight="400" text-anchor="start" fill="#475569">SanPhamGoiY: PK(MaTN, MaSP), ThuTu &gt; 0; mỗi MaTN không trùng ThuTu. MaTN ở đây luôn là MaTNAI.</text>
<text x="38" y="2513.0" font-size="14" font-weight="400" text-anchor="start" fill="#475569">NguonTraLoi.MaKT có thể NULL với nguồn trang sản phẩm; giữ tiêu đề, URL và bản chụp nội dung theo ERD.</text>
<text x="38" y="2543.0" font-size="14" font-weight="400" text-anchor="start" fill="#475569">Tin AI có MaTK=NULL. CheDo và TenMoHinh lưu cùng TinNhanChat; không phải một bảng nhà cung cấp AI.</text>
<text x="38" y="2573.0" font-size="14" font-weight="400" text-anchor="start" fill="#475569">Mỗi break kết thúc toàn bộ interaction này: rollback các thay đổi trong transaction; tin khách trước đó vẫn giữ.</text>
<text x="38" y="2603.0" font-size="14" font-weight="400" text-anchor="start" fill="#475569">Nếu BEGIN thất bại thì trả lỗi ngay. Không giữ transaction mở trong thời gian chờ AI ở Sequence 02.</text>
