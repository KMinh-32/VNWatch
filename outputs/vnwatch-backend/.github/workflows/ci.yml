name: backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: vnwatch
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_DB: vnwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vnwatch -d vnwatch_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vnwatch:ci-fixture-only@127.0.0.1:5432/vnwatch_test
      TEST_DATABASE_URL: postgresql://vnwatch:ci-fixture-only@127.0.0.1:5432/vnwatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run openapi:export
