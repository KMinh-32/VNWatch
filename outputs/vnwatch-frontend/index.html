<!doctype html>
<!-- HỌC VNWATCH: Khung HTML của cửa hàng: metadata/font, thẻ root và module khởi động React. -->
<html lang="vi">
  <!-- Metadata/font dành cho trình duyệt; phần này không phải nội dung nhìn thấy của trang. -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173c32" />
    <meta
      name="description"
      content="Khám phá VNWatch — giao diện cửa hàng đồng hồ trong dự án portfolio."
    />
    <title>VNWatch — Thời gian mang dấu ấn riêng</title>
  </head>
  <!-- Nội dung trang: React sẽ quản lý cây giao diện bên trong root. -->
  <body>
    <!-- Điểm gắn React; createRoot trong main.tsx/desktop.tsx render ứng dụng tại đây. -->
    <div id="root"></div>
    <!-- Module TypeScript điểm vào do Vite xử lý khi dev/build. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
