# HỌC VNWATCH — outputs/vnwatch-frontend/nginx.conf
# Nginx phục vụ React và route trang sản phẩm. docker/gateway.conf chịu trách nhiệm định tuyến API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Khối route Nginx chọn request khớp URL; chú ý thứ tự và loại match để hiểu quyền truy cập.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Khối route Nginx chọn request khớp URL; chú ý thứ tự và loại match để hiểu quyền truy cập.
    location ~ ^/admin(?:/|$) {
        default_type text/plain;
        charset utf-8;
        return 410 "Phần quản trị đã chuyển sang ứng dụng Windows VNWatch Manager. Mở ứng dụng trên Desktop hoặc menu Start.";
    }

    # Mọi API đi qua gateway. Frontend chỉ cung cấp file tĩnh và route React.
    location /api/ { return 404; }
    location ~ ^/docs(?:$|/|-json$) { return 404; }

    # Khối route Nginx chọn request khớp URL; chú ý thứ tự và loại match để hiểu quyền truy cập.
    location /assets/ {
        # Tìm asset thật rồi dùng HTML fallback để route SPA hoạt động.
        try_files $uri =404;
        expires 1y;
        # Gắn header response như cache/bảo mật, không thay thế kiểm tra role tại backend.
        add_header Cache-Control "public, immutable";
    }

    # Khối route Nginx chọn request khớp URL; chú ý thứ tự và loại match để hiểu quyền truy cập.
    location / {
        # Tìm asset thật rồi dùng HTML fallback để route SPA hoạt động.
        try_files $uri $uri/ /index.html;
        # Gắn header response như cache/bảo mật, không thay thế kiểm tra role tại backend.
        add_header Cache-Control "no-cache";
    }
}
