# VNWatch API Gateway — điểm vào HTTP cho các dịch vụ.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $business http://backend:3000;
    set $storefront http://frontend:8080;
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    # Giao dịch ghi có thể đã được xử lý ở backend, gateway không tự gửi lại request.
    proxy_next_upstream off;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }
    location /api/ {
        proxy_pass $business$request_uri;
    }
    location ~ ^/docs(?:$|/|-json$) {
        proxy_pass $business$request_uri;
    }
    # Giao diện quản trị đã được cài dưới dạng ứng dụng Windows.
    location ~ ^/admin(?:/|$) {
        default_type text/plain;
        charset utf-8;
        return 410 "Mở ứng dụng VNWatch Manager trên Windows để quản trị cửa hàng.";
    }
    location ~ ^/internal(?:/|$) { return 404; }
    location / {
        proxy_pass $storefront$request_uri;
    }
}
