# HỌC VNWATCH — docker/share-nginx.conf
# Proxy dành riêng cho chia sẻ: chỉ cho các route mua hàng công khai/cá nhân, chặn route quản trị và giới hạn request.
# Public preview: allow only storefront files and public catalog reads.
# The original frontend on 5180 retains its normal login/admin/checkout behavior.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $store http://gateway:8080;

    client_max_body_size 1k;
    error_page 403 = @preview_only;
    # Gắn header response như cache/bảo mật, không thay thế kiểm tra role tại backend.
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Gắn header response như cache/bảo mật, không thay thế kiểm tra role tại backend.
    add_header X-Content-Type-Options nosniff always;
    # Gắn header response như cache/bảo mật, không thay thế kiểm tra role tại backend.
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Accept-Encoding "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;

    # Reject all mutation verbs, including on paths which normally allow GET.
    if ($request_method !~ ^(GET|HEAD)$) { return 403; }

    # Khối route Nginx chọn request khớp URL; chú ý thứ tự và loại match để hiểu quyền truy cập.
    location @preview_only {
        default_type application/json;
        charset utf-8;
        return 403 '{"code":"PREVIEW_READ_ONLY","message":"Đây là bản xem thử công khai. Đăng nhập, quản trị và đặt hàng chỉ dùng tại website trên máy chủ."}';
    }

    # Khối route Nginx chọn request khớp URL; chú ý thứ tự và loại match để hiểu quyền truy cập.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Khối route Nginx chọn request khớp URL; chú ý thứ tự và loại match để hiểu quyền truy cập.
    location = / {
        # Chuyển request tới backend trong mạng nội bộ Docker.
        proxy_pass $store/;
        sub_filter '<body>' '<body><div role="status" style="background:#173c32;color:#fff;text-align:center;padding:10px 16px;font:14px sans-serif">VNWATCH · Bản xem thử công khai — xem sản phẩm, chưa hỗ trợ đăng nhập hoặc đặt hàng.</div><style>a[href="/admin"]{display:none}</style>';
        sub_filter_once on;
    }
    # Khối route Nginx chọn request khớp URL; chú ý thứ tự và loại match để hiểu quyền truy cập.
    location = /index.html {
        # Chuyển request tới backend trong mạng nội bộ Docker.
        proxy_pass $store/index.html;
        sub_filter '<body>' '<body><div role="status" style="background:#173c32;color:#fff;text-align:center;padding:10px 16px;font:14px sans-serif">VNWATCH · Bản xem thử công khai — xem sản phẩm, chưa hỗ trợ đăng nhập hoặc đặt hàng.</div><style>a[href="/admin"]{display:none}</style>';
        sub_filter_once on;
    }
    # Khối route Nginx chọn request khớp URL; chú ý thứ tự và loại match để hiểu quyền truy cập.
    location ~ ^/assets/[a-zA-Z0-9._-]+$ {
        # Chuyển request tới backend trong mạng nội bộ Docker.
        proxy_pass $store$uri$is_args$args;
    }
    # Khối route Nginx chọn request khớp URL; chú ý thứ tự và loại match để hiểu quyền truy cập.
    location ~ "^/api/v1/products(?:/[0-9a-fA-F-]{36})?/?$" {
        # Chuyển request tới backend trong mạng nội bộ Docker.
        proxy_pass $store$uri$is_args$args;
    }
    # Khối route Nginx chọn request khớp URL; chú ý thứ tự và loại match để hiểu quyền truy cập.
    location ~ "^/api/v1/shop/reviews/[0-9a-fA-F-]{36}/?$" {
        # Chuyển request tới backend trong mạng nội bộ Docker.
        proxy_pass $store$uri$is_args$args;
    }

    # Các đường đọc phục vụ giao diện catalog và trang sản phẩm riêng.
    location = /api/v1/products/facets { proxy_pass $store$uri$is_args$args; }
    location ~ "^/products/[0-9a-fA-F-]{36}/?$" { proxy_pass $store$uri$is_args$args; }
    location ~ ^/images/catalog/[a-zA-Z0-9._-]+$ { proxy_pass $store$uri$is_args$args; }

    # Deny admin, docs, login, shopping writes and any unlisted endpoint.
    # Khối route Nginx chọn request khớp URL; chú ý thứ tự và loại match để hiểu quyền truy cập.
    location / { return 403; }
}
